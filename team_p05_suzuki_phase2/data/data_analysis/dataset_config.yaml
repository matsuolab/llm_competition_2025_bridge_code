# Filtering options
filters:
  # Categories to include (uncomment and modify as needed)
  # includes:
  #   - "Math"
  #   - "math"
  
  # Categories to exclude
  excludes:
    - "code_nisiwaki"
  
  # Filter out images
  exclude_images: true

# UMAP parameters
umap:
  n_neighbors: 15
  min_dist: 0.1
  random_state: 42

# Clustering parameters
clustering:
  method: "kmeans"  # "kmeans" or "dbscan"
  n_clusters: 8
  # For DBSCAN:
  # eps: 0.5
  # min_samples: 5

# Visualization settings
visualization:
  default_color_by: "category"
  plot_width: 1500
  plot_height: 1000
  marker_size: 8
  marker_opacity: 0.7 